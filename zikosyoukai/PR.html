<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>自己紹介ページ</title>
</head><!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>自己紹介ページ</title>
</head>
<body>

    <h1>諏訪竜大</h1>

    <p>三重に住んでいる大学生です。</p>

    <img src="cat.png" alt="プロフィール写真" width="300">

    <h2>好きなもの</h2>
    <ul>
        <li>睡眠</li>
        <li>ゲーム</li>
        <li>自転車</li>
    </ul>

    <h2>休日の過ごし方</h2>
    <ol>
        <li>ゲームを友達とする</li>
        <li>課題や勉強に取り組む</li>
        <li>猫と遊ぶ</li>
    </ol>

    <h2>時間割（例）</h2>
    <table border="1">
        <tr>
            <th>曜日</th>
            <th>1限</th>
            <th>2限</th>
        </tr>
        <tr>
            <td>月曜日</td>
            <td>HTMLプログラミング</td>
            <td>英語</td>
        </tr>
    </table>

    <h2>問い合わせ・メッセージ</h2>
    <form action="#" method="post">
        <p>
            <label for="name">お名前：</label>
            <input type="text" id="name" name="name">
        </p>
        <p>
            <label for="department">学年・学部：</label>
            <select id="department" name="department">
                <option value="1nen">1年生</option>
                <option value="2nen">2年生</option>
            </select>
        </p>
        <p>
            <label for="message">メッセージ：</label><br>
            <textarea id="message" name="message" rows="4" cols="30"></textarea>
        </p>
        <p>
            <button type="submit">送信する</button>
        </p>
    </form>

    <h2>おすすめのページ</h2>
    <p><a href="https://www.youtube.com/">Youtube</a></p>

</body>
</html>
