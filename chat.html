<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegulのねこチャット</title>
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
<main class="chat">
<header><h1>Vegulのねこチャット</h1><p>猫とゲームの話</p></header>
<section class="messages" aria-label="会話">
<div class="row"><p class="bubble">今日は何してた？</p></div>
<div class="row mine"><p class="bubble">友達とゲームしてた！</p></div>
<div class="row"><p class="bubble">猫も一緒？</p></div>
<div class="row mine"><p class="bubble">うん。遊んでいるとキーボードの前に座ってくるから、少し休憩して猫と遊んだよ。</p></div>
<div class="row"><p class="bubble">猫が休憩の合図だね。</p></div>
<div class="row mine"><p class="bubble">そうだね。また明日！</p></div>
</section>
<div class="composer"><input aria-label="メッセージ" placeholder="メッセージを入力"><button type="button">送信</button></div>
</main>
</body>
</html>
